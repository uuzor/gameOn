[package]
name = "battlechain_v2"
version = "0.1.0"
description = "BattleChain V2 - Turn-based NFT Battle Game"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "battlechain_v2"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = "0.29.0"
